# hyprlock — HX fósforo verde (probado contra hyprlock v0.9.5)
# Estética de terminal: reloj grande, aviso entre corchetes, prompt rectangular.

$font   = JetBrainsMono Nerd Font
$fg     = rgb(00ff41)
$mid    = rgb(00a82d)
$dim    = rgb(0f5c26)
$warn   = rgb(ffb000)
$crit   = rgb(ff3131)

general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 2000
}

# Animaciones secas y rápidas
animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 3, linear
    animation = fadeOut, 1, 3, linear
    animation = inputFieldDots, 1, 2, linear
}

# Fondo: variante oscura del wallpaper con blur ligero (vacío = todos los monitores)
background {
    monitor =
    path = $HOME/.config/hypr/wallpapers/hx-lock.png
    color = rgb(000000)
    blur_passes = 1
    blur_size = 3
    noise = 0.008
    brightness = 0.9
}

# Hora (reloj de terminal)
label {
    monitor =
    text = $TIME
    color = $fg
    font_size = 120
    font_family = $font ExtraBold
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(00ff4155)
    position = 0, 230
    halign = center
    valign = center
}

# Fecha
label {
    monitor =
    text = cmd[update:60000] LC_TIME=es_ES.UTF-8 date +"%A %d %B"
    color = $mid
    font_size = 20
    font_family = $font
    position = 0, 105
    halign = center
    valign = center
}

# Aviso de bloqueo
label {
    monitor =
    text = <span foreground="##00ff41">[ sistema bloqueado ]</span> <span foreground="##0f5c26">—</span> <span foreground="##00a82d">autenticación requerida</span>
    color = $fg
    font_size = 13
    font_family = $font
    position = 0, 20
    halign = center
    valign = center
}

# Prompt de contraseña: rectángulo sin redondear
input-field {
    monitor =
    size = 420, 48
    outline_thickness = 2
    rounding = 0
    outer_color = $fg
    inner_color = rgb(000000)
    font_color = $fg
    font_family = $font
    check_color = $warn
    fail_color = $crit
    capslock_color = $warn
    fail_text = <span foreground="##ff3131">acceso denegado ($ATTEMPTS)</span>
    check_text = verificando...
    placeholder_text = <span foreground="##0f5c26">password:</span>
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = false
    fade_on_empty = false
    hide_input = false
    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgba(00ff4140)
    position = 0, -50
    halign = center
    valign = center
}

# Usuario
label {
    monitor =
    text = $USER@hypr
    color = $dim
    font_size = 12
    font_family = $font
    position = 0, -110
    halign = center
    valign = center
}

# Pie: pista de teclas
label {
    monitor =
    text = esc / ctrl+u  limpiar  ::  enter  desbloquear
    color = $dim
    font_size = 10
    font_family = $font
    position = 0, 30
    halign = center
    valign = bottom
}
