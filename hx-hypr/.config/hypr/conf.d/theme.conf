# hx :: theme — paleta fósforo verde (fija)

$bg     = rgb(000000)   # fondo
$bgAlt  = rgb(030b05)   # superficies
$bgHl   = rgb(0a1f0f)   # selección / hover
$dim    = rgb(0f5c26)   # bordes inactivos, texto apagado
$mid    = rgb(00a82d)   # texto secundario
$fg     = rgb(00ff41)   # texto principal / acento
$bright = rgb(9dffb0)   # resaltado
$warn   = rgb(ffb000)   # ámbar
$crit   = rgb(ff3131)   # rojo

$font   = JetBrainsMono Nerd Font

# rutas y apps
$hx       = $HOME/.config/hypr
$scripts  = $HOME/.config/hypr/scripts
$term     = kitty
$files    = thunar
$browser  = google-chrome --profile-directory='Default'
$menu     = rofi -show drun
