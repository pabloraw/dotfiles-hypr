# hx :: rules — sintaxis 0.55 (match:..., efecto valor)

# --- flotantes: utilidades del sistema ---
windowrule = match:class ^(pavucontrol|org\.pulseaudio\.pavucontrol|com\.saivert\.pwvucontrol)$, float on, center on, size (monitor_w*0.45) (monitor_h*0.55)
windowrule = match:class ^(nm-connection-editor|nm-applet)$, float on, center on
windowrule = match:class ^(blueman-manager|\.blueman-manager-wrapped)$, float on, center on
windowrule = match:class ^(qt5ct|qt6ct|nwg-look|nwg-displays)$, float on, center on
windowrule = match:class ^(org\.gnome\.Calculator|qalculate-gtk)$, float on

# --- polkit ---
windowrule = match:class ^(org\.kde\.polkit-kde-authentication-agent-1|polkit-gnome-authentication-agent-1|hyprpolkitagent)$, float on, center on, pin on
windowrule = match:title ^(Authentication Required|Autenticación requerida)$, float on, center on

# --- satty: flotante y sin transparencia ---
windowrule = match:class ^(com\.gabm\.satty|satty)$, float on, center on, opacity 1 1 override

# --- diálogos de archivo ---
windowrule = match:class ^(xdg-desktop-portal-gtk)$, float on, center on, size (monitor_w*0.6) (monitor_h*0.6)
windowrule = match:title ^(Open File|Open Files|Open Folder|Save As|Save File|Abrir archivo|Abrir archivos|Guardar como|Guardar archivo|Seleccionar carpeta)(.*)$, float on, center on, size (monitor_w*0.6) (monitor_h*0.6)
windowrule = match:title ^(File Operation Progress|Progreso de la operación con archivos)$, float on

# --- picture-in-picture ---
windowrule = match:title ^(Picture-in-Picture|Imagen en imagen)$, float on, pin on, keep_aspect_ratio on, opacity 1 1 override

# --- opacidad: navegador y vídeo siempre opacos ---
windowrule = match:class ^([Gg]oogle-chrome(-beta|-dev|-unstable)?|chrome-.+-Default)$, opacity 1 1 override
windowrule = match:class ^(mpv|vlc)$, opacity 1 1 override, no_blur on

# --- xwayland: no robar foco con ventanas fantasma (drag & drop) ---
windowrule = match:class ^()$ match:title ^()$ match:xwayland true, no_focus on

# --- layers: blur detrás de barra, menú y notificaciones ---
layerrule = match:namespace waybar, blur on
layerrule = match:namespace waybar, ignore_alpha 0.3
layerrule = match:namespace rofi, blur on
layerrule = match:namespace rofi, ignore_alpha 0.3
layerrule = match:namespace ^(swaync-control-center|swaync-notification-window)$, blur on
layerrule = match:namespace ^(swaync-control-center|swaync-notification-window)$, ignore_alpha 0.3
