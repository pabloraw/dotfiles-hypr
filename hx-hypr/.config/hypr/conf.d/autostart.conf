# hx :: autostart

# entorno para dbus/systemd (portales, keyring, etc.)
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE HYPRLAND_INSTANCE_SIGNATURE
exec-once = gnome-keyring-daemon --start --components=secrets,pkcs11,gpg,ssh
exec-once = $scripts/polkit.sh

# fondo
exec-once = swww-daemon --format xrgb
exec-once = $scripts/wallpaper.sh   # espera sola a que el daemon responda

# barra, notificaciones, inactividad, portapapeles
exec-once = waybar
exec-once = swaync
exec-once = hypridle
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# terminales iniciales (una por monitor)
exec-once = [workspace 1 silent] $term
exec-once = sleep 2 && hyprctl dispatch exec "[workspace 6 silent] $term"
