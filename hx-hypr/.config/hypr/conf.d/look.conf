# hx :: look — CRT, negro puro, borde verde con glow

general {
    border_size = 2
    gaps_in = 4
    gaps_out = 8
    col.active_border = rgba(00ff41ff) rgba(0f5c26ff) 45deg
    col.inactive_border = rgba(0f5c2655)
    resize_on_border = true
    layout = dwindle
}

decoration {
    rounding = 0

    active_opacity = 1.0
    inactive_opacity = 0.92
    fullscreen_opacity = 1.0

    # atenuado suave de las inactivas
    dim_inactive = true
    dim_strength = 0.06
    dim_special = 0.6

    # glow verde: sombra difusa sin desplazamiento
    shadow {
        enabled = true
        range = 12
        render_power = 3
        offset = 0 0
        color = rgba(00ff4144)
        color_inactive = rgba(00000000)
    }

    # blur sutil (solo se nota en inactivas y capas translúcidas)
    blur {
        enabled = true
        size = 4
        passes = 2
        new_optimizations = true
        ignore_opacity = true
        xray = false
        special = true
        popups = true
    }
}

# animaciones secas: curvas sin sobreimpulso
animations {
    enabled = true

    bezier = hxOut,    0.16, 1, 0.3, 1   # ease-out
    bezier = hxLinear, 0, 0, 1, 1

    animation = global,      1, 3, hxOut
    animation = windows,     1, 3, hxOut, popin 90%
    animation = windowsOut,  1, 2, hxLinear, popin 90%
    animation = border,      1, 4, hxLinear
    animation = fade,        1, 3, hxOut
    animation = fadeOut,     1, 2, hxLinear
    animation = layers,      1, 2, hxOut, fade
    animation = workspaces,  1, 3, hxOut, slidefade 15%
    animation = specialWorkspace, 1, 3, hxOut, slidefadevert 15%
}

group {
    col.border_active = rgba(00ff41ff)
    col.border_inactive = rgba(0f5c2655)
    col.border_locked_active = rgba(ffb000ff)
    col.border_locked_inactive = rgba(0f5c2655)

    groupbar {
        enabled = true
        font_family = $font
        font_size = 10
        height = 16
        gradients = true
        rounding = 0
        gradient_rounding = 0
        render_titles = true
        text_color = rgb(000000)
        text_color_inactive = rgb(00a82d)
        col.active = rgba(00ff41ff)
        col.inactive = rgba(030b05ff)
        col.locked_active = rgba(ffb000ff)
        col.locked_inactive = rgba(030b05ff)
    }
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = rgb(000000)
    font_family = $font
    vrr = 2
    allow_session_lock_restore = true
    focus_on_activate = false
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    enable_swallow = false
    middle_click_paste = false
}

cursor {
    no_hardware_cursors = 1     # nvidia
    enable_hyprcursor = true
    sync_gsettings_theme = true
}

render {
    direct_scanout = 0          # nvidia
}

debug {
    disable_logs = true         # mitiga crash de Aquamarine
}

xwayland {
    force_zero_scaling = true
}

dwindle {
    preserve_split = true
    special_scale_factor = 0.85
}

master {
    new_status = master
    mfact = 0.5
}
