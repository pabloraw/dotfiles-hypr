# hx :: binds — todos con descripción (la lista keybinds.sh)
# formato: bindd = MODS, tecla, descripción, dispatcher, args

$mod = SUPER

# --- apps ---
bindd = $mod, Return, terminal, exec, $term
bindd = $mod, D, lanzador de apps, exec, pkill rofi || $menu
bindd = $mod, E, gestor de archivos, exec, $files
bindd = $mod, B, navegador, exec, $browser
bindd = $mod, H, lista de atajos, exec, $scripts/keybinds.sh
bindd = $mod ALT, V, historial del portapapeles, exec, $scripts/clipboard.sh
bindd = $mod CTRL, S, selector de ventanas, exec, pkill rofi || rofi -show window
bindd = $mod SHIFT, N, panel de notificaciones, exec, swaync-client -t -sw
bindd = $mod SHIFT, C, captura del móvil por adb, exec, $scripts/adb-screenshot.sh

# --- sesión ---
bindd = $mod CTRL ALT, L, bloquear pantalla, exec, pidof hyprlock || hyprlock
bindd = $mod CTRL ALT, P, menú de apagado, exec, $scripts/powermenu.sh
bindd = $mod CTRL ALT, Delete, salir de hyprland, exit,
bindd = $mod CTRL ALT, B, mostrar/ocultar waybar, exec, pkill -SIGUSR1 waybar
bindd = , XF86Sleep, suspender, exec, systemctl suspend

# --- ventanas ---
bindd = $mod, Q, cerrar ventana, killactive,
bindd = $mod, SPACE, alternar flotante, togglefloating,
bindd = $mod SHIFT, F, pantalla completa, fullscreen, 0
bindd = $mod CTRL, F, maximizar, fullscreen, 1
bindd = $mod, P, pseudo-tile, pseudo,
bindd = $mod SHIFT, I, alternar división, layoutmsg, togglesplit

# foco
bindd = $mod, left, foco izquierda, movefocus, l
bindd = $mod, right, foco derecha, movefocus, r
bindd = $mod, up, foco arriba, movefocus, u
bindd = $mod, down, foco abajo, movefocus, d

# redimensionar (repetible)
binded = $mod SHIFT, left, encoger ancho, resizeactive, -50 0
binded = $mod SHIFT, right, ampliar ancho, resizeactive, 50 0
binded = $mod SHIFT, up, encoger alto, resizeactive, 0 -50
binded = $mod SHIFT, down, ampliar alto, resizeactive, 0 50

# mover
bindd = $mod CTRL, left, mover ventana izquierda, movewindow, l
bindd = $mod CTRL, right, mover ventana derecha, movewindow, r
bindd = $mod CTRL, up, mover ventana arriba, movewindow, u
bindd = $mod CTRL, down, mover ventana abajo, movewindow, d

# intercambiar
bindd = $mod ALT, left, intercambiar izquierda, swapwindow, l
bindd = $mod ALT, right, intercambiar derecha, swapwindow, r
bindd = $mod ALT, up, intercambiar arriba, swapwindow, u
bindd = $mod ALT, down, intercambiar abajo, swapwindow, d

# ratón
bindmd = $mod, mouse:272, mover con ratón, movewindow
bindmd = $mod, mouse:273, redimensionar con ratón, resizewindow

# --- grupos ---
bindd = $mod, G, alternar grupo, togglegroup,
bindd = $mod CTRL, Tab, siguiente del grupo, changegroupactive,
bindd = ALT, Tab, ciclar ventanas, cyclenext,
bindd = ALT, Tab, traer al frente, bringactivetotop,

# --- workspaces ---
bindd = $mod, Tab, workspace siguiente, workspace, m+1
bindd = $mod SHIFT, Tab, workspace anterior, workspace, m-1
bindd = $mod, period, workspace siguiente (existente), workspace, e+1
bindd = $mod, comma, workspace anterior (existente), workspace, e-1
bindd = $mod, mouse_down, workspace siguiente (existente), workspace, e+1
bindd = $mod, mouse_up, workspace anterior (existente), workspace, e-1

bindd = $mod, U, alternar scratchpad, togglespecialworkspace,
bindd = $mod SHIFT, U, mover a scratchpad, movetoworkspace, special

# 1..0 (code:10..19)
bindd = $mod, code:10, ir a workspace 1, workspace, 1
bindd = $mod, code:11, ir a workspace 2, workspace, 2
bindd = $mod, code:12, ir a workspace 3, workspace, 3
bindd = $mod, code:13, ir a workspace 4, workspace, 4
bindd = $mod, code:14, ir a workspace 5, workspace, 5
bindd = $mod, code:15, ir a workspace 6, workspace, 6
bindd = $mod, code:16, ir a workspace 7, workspace, 7
bindd = $mod, code:17, ir a workspace 8, workspace, 8
bindd = $mod, code:18, ir a workspace 9, workspace, 9
bindd = $mod, code:19, ir a workspace 10, workspace, 10

bindd = $mod SHIFT, code:10, mover a workspace 1, movetoworkspace, 1
bindd = $mod SHIFT, code:11, mover a workspace 2, movetoworkspace, 2
bindd = $mod SHIFT, code:12, mover a workspace 3, movetoworkspace, 3
bindd = $mod SHIFT, code:13, mover a workspace 4, movetoworkspace, 4
bindd = $mod SHIFT, code:14, mover a workspace 5, movetoworkspace, 5
bindd = $mod SHIFT, code:15, mover a workspace 6, movetoworkspace, 6
bindd = $mod SHIFT, code:16, mover a workspace 7, movetoworkspace, 7
bindd = $mod SHIFT, code:17, mover a workspace 8, movetoworkspace, 8
bindd = $mod SHIFT, code:18, mover a workspace 9, movetoworkspace, 9
bindd = $mod SHIFT, code:19, mover a workspace 10, movetoworkspace, 10

bindd = $mod CTRL, code:10, mover a workspace 1 (silencio), movetoworkspacesilent, 1
bindd = $mod CTRL, code:11, mover a workspace 2 (silencio), movetoworkspacesilent, 2
bindd = $mod CTRL, code:12, mover a workspace 3 (silencio), movetoworkspacesilent, 3
bindd = $mod CTRL, code:13, mover a workspace 4 (silencio), movetoworkspacesilent, 4
bindd = $mod CTRL, code:14, mover a workspace 5 (silencio), movetoworkspacesilent, 5
bindd = $mod CTRL, code:15, mover a workspace 6 (silencio), movetoworkspacesilent, 6
bindd = $mod CTRL, code:16, mover a workspace 7 (silencio), movetoworkspacesilent, 7
bindd = $mod CTRL, code:17, mover a workspace 8 (silencio), movetoworkspacesilent, 8
bindd = $mod CTRL, code:18, mover a workspace 9 (silencio), movetoworkspacesilent, 9
bindd = $mod CTRL, code:19, mover a workspace 10 (silencio), movetoworkspacesilent, 10

# teclado numérico — mismas variantes
bindd = $mod, KP_End, ir a workspace 1, workspace, 1
bindd = $mod, KP_Down, ir a workspace 2, workspace, 2
bindd = $mod, KP_Next, ir a workspace 3, workspace, 3
bindd = $mod, KP_Left, ir a workspace 4, workspace, 4
bindd = $mod, KP_Begin, ir a workspace 5, workspace, 5
bindd = $mod, KP_Right, ir a workspace 6, workspace, 6
bindd = $mod, KP_Home, ir a workspace 7, workspace, 7
bindd = $mod, KP_Up, ir a workspace 8, workspace, 8
bindd = $mod, KP_Prior, ir a workspace 9, workspace, 9
bindd = $mod, KP_Insert, ir a workspace 10, workspace, 10

bindd = $mod SHIFT, KP_End, mover a workspace 1, movetoworkspace, 1
bindd = $mod SHIFT, KP_Down, mover a workspace 2, movetoworkspace, 2
bindd = $mod SHIFT, KP_Next, mover a workspace 3, movetoworkspace, 3
bindd = $mod SHIFT, KP_Left, mover a workspace 4, movetoworkspace, 4
bindd = $mod SHIFT, KP_Begin, mover a workspace 5, movetoworkspace, 5
bindd = $mod SHIFT, KP_Right, mover a workspace 6, movetoworkspace, 6
bindd = $mod SHIFT, KP_Home, mover a workspace 7, movetoworkspace, 7
bindd = $mod SHIFT, KP_Up, mover a workspace 8, movetoworkspace, 8
bindd = $mod SHIFT, KP_Prior, mover a workspace 9, movetoworkspace, 9
bindd = $mod SHIFT, KP_Insert, mover a workspace 10, movetoworkspace, 10

bindd = $mod CTRL, KP_End, mover a workspace 1 (silencio), movetoworkspacesilent, 1
bindd = $mod CTRL, KP_Down, mover a workspace 2 (silencio), movetoworkspacesilent, 2
bindd = $mod CTRL, KP_Next, mover a workspace 3 (silencio), movetoworkspacesilent, 3
bindd = $mod CTRL, KP_Left, mover a workspace 4 (silencio), movetoworkspacesilent, 4
bindd = $mod CTRL, KP_Begin, mover a workspace 5 (silencio), movetoworkspacesilent, 5
bindd = $mod CTRL, KP_Right, mover a workspace 6 (silencio), movetoworkspacesilent, 6
bindd = $mod CTRL, KP_Home, mover a workspace 7 (silencio), movetoworkspacesilent, 7
bindd = $mod CTRL, KP_Up, mover a workspace 8 (silencio), movetoworkspacesilent, 8
bindd = $mod CTRL, KP_Prior, mover a workspace 9 (silencio), movetoworkspacesilent, 9
bindd = $mod CTRL, KP_Insert, mover a workspace 10 (silencio), movetoworkspacesilent, 10

# --- capturas ---
bindd = , Print, captura anotada (satty), exec, $scripts/screenshot.sh satty
bindd = $mod, Print, captura de pantalla, exec, $scripts/screenshot.sh now
bindd = $mod SHIFT, Print, captura de área, exec, $scripts/screenshot.sh area
bindd = ALT, Print, captura de ventana, exec, $scripts/screenshot.sh window

# --- multimedia (activas también con pantalla bloqueada) ---
bindeld = , XF86AudioRaiseVolume, subir volumen, exec, $scripts/volume.sh up
bindeld = , XF86AudioLowerVolume, bajar volumen, exec, $scripts/volume.sh down
bindld = , XF86AudioMute, silenciar, exec, $scripts/volume.sh mute
bindld = , XF86AudioMicMute, silenciar micro, exec, $scripts/volume.sh mic
bindld = , XF86AudioPlay, play/pausa, exec, $scripts/media.sh play
bindld = , XF86AudioPause, play/pausa, exec, $scripts/media.sh play
bindld = , XF86AudioNext, siguiente pista, exec, $scripts/media.sh next
bindld = , XF86AudioPrev, pista anterior, exec, $scripts/media.sh prev
bindld = , XF86AudioStop, parar, exec, $scripts/media.sh stop
