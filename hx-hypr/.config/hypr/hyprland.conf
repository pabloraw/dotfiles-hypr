# hx :: hyprland — fósforo verde
# Punto de entrada. Todo vive en conf.d/, cargado en este orden.
# Las rutas de source son relativas a este archivo.

source = ./conf.d/theme.conf      # paleta ($bg, $fg, ...) — primero, la usan los demás
source = ./conf.d/env.conf        # variables de entorno
source = ./conf.d/monitors.conf   # monitores + workspaces
source = ./conf.d/input.conf      # teclado / ratón
source = ./conf.d/look.conf       # bordes, sombras, blur, animaciones, layouts
source = ./conf.d/rules.conf      # windowrule / layerrule
source = ./conf.d/binds.conf      # atajos
source = ./conf.d/autostart.conf  # exec-once
