# hx :: kitty — terminal fósforo verde (kitty 0.32)

# --- fuente ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
# más grosor/contraste en texto claro sobre negro (efecto fósforo)
text_composition_strategy 1.7 0
disable_ligatures cursor

# --- cursor: bloque verde parpadeante ---
cursor                  #00ff41
cursor_text_color       #000000
cursor_shape            block
cursor_beam_thickness   1.5
cursor_blink_interval   0.5
cursor_stop_blinking_after 0

# --- ventana ---
window_padding_width    8
background_opacity      0.92
confirm_os_window_close 0
hide_window_decorations yes
placement_strategy      top-left
active_border_color     #00ff41
inactive_border_color   #0f5c26
window_border_width     1px

# --- pestañas (ocultas: se usa Hyprland para gestionar ventanas) ---
tab_bar_style           hidden

# --- comportamiento ---
scrollback_lines        10000
enable_audio_bell       no
visual_bell_duration    0
copy_on_select          no
strip_trailing_spaces   smart
url_style               curly
detect_urls             yes
mouse_hide_wait         2.0

# --- colores base ---
background              #000000
foreground              #00ff41
selection_background    #00ff41
selection_foreground    #000000
url_color               #9dffb0
mark1_background        #00ff41
mark1_foreground        #000000
mark2_background        #ffb000
mark2_foreground        #000000
mark3_background        #ff3131
mark3_foreground        #000000

# --- paleta ANSI ---
# negro / gris verdoso
color0   #030b05
color8   #2f5a3a
# rojo (errores, git diff -)
color1   #ff3131
color9   #ff6b6b
# verde (git diff +, ok)
color2   #00c837
color10  #00ff41
# ámbar (avisos)
color3   #ffb000
color11  #ffd060
# azul -> verde-cian (directorios, info)
color4   #00b894
color12  #3fffc8
# magenta -> verde lima (claves, constantes)
color5   #7fd85a
color13  #b4ff8a
# cian -> verde agua
color6   #2ee6a6
color14  #8affd8
# blanco -> verde pálido
color7   #a8d8b0
color15  #d8ffe0
