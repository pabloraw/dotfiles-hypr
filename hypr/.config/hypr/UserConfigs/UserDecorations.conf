# Decoration Settings

# Hyprland Wiki Links
# Animation - https://wiki.hyprland.org/Configuring/Animations/
# Decoration - https://wiki.hyprland.org/Configuring/Variables/#decoration

# Sourcing colors generated by wallust
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

general {
  border_size = 2
  gaps_in = 2
  gaps_out = 2

  # Colores fijos de la paleta de la barra (no de wallust): naranja activo, gris de chicklet neutra inactivo
  col.active_border = rgb(E8A847)
  col.inactive_border = rgb(343f44)
}

decoration {
  rounding = 8
  
  active_opacity = 1.0
  inactive_opacity = 0.9
  fullscreen_opacity = 1.0

  dim_inactive = true
  dim_strength = 0.05
  dim_special = 0.8

  shadow {
    enabled = true
    range = 8
    render_power = 3

    # Sombra neutra para dar profundidad; el color lo pone el borde
    color = rgba(00000088)
    color_inactive = rgba(00000044)
  }

  blur {
    enabled = true
    size = 6
    passes = 3
    new_optimizations = true
    xray = true
    ignore_opacity = true
    special = true
    popups = true
  }
}

group {
  col.border_active = $color15

	groupbar {
		col.active = $color0
  }
}
